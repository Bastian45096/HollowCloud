{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/storage/storage.css' %}">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-content">
            <h1 style="display: flex; align-items: center; gap: 12px; color: #dfdbd2;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink: 0;">
                    <path d="M20 6H12L10 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V8C22 6.9 21.1 6 20 6Z" 
                        fill="#E95420" fill-opacity="0.15" stroke="#E95420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 10C10.5 10 9.2 10.8 8.5 12C7.2 12.2 6.2 13.3 6.2 14.6C6.2 16.1 7.4 17.3 8.9 17.3H15.1C16.6 17.3 17.8 16.1 17.8 14.6C17.8 13.3 16.8 12.2 15.5 12C14.8 10.8 13.5 10 12 10Z" 
                        fill="#E95420" stroke="#E95420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 13V15M12 15L10.5 13.5M12 15L13.5 13.5" 
                        stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
                </svg>
                <span>HollowStorage</span>
            </h1>

            <div class="actions" style="display: flex; align-items: center; gap: 12px;">
                <button class="btn-secondary" onclick="app.openCreateFolderModal()" style="display: inline-flex; align-items: center; justify-content: center;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 8px; flex-shrink: 0;">
                        <path d="M20 7H12L10 5H4C2.9 5 2 5.9 2 7V19C2 20.1 2.9 21 4 21H20C21.1 21 22 20.1 22 19V9C22 7.9 21.1 7 20 7Z" 
                            stroke="#E95420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 11V13M12 13L10.5 11.5M12 13L13.5 11.5M12 15V16" 
                            stroke="#E95420" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="12" cy="12" r="3.5" stroke="#E95420" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8"/>
                    </svg>
                    <span>Nueva Carpeta</span>
                </button>

                <label class="btn-primary" style="display: inline-flex; align-items: center; justify-content: center; cursor: pointer;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 8px; flex-shrink: 0;">
                        <path d="M4 15C4 17.7614 6.23858 20 9 20H15C17.7614 20 20 17.7614 20 15C20 12.2386 17.7614 10 15 10" 
                            stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
                        <path d="M12 14V8M12 8L10 10M12 8L14 10" 
                            stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M8 20V18M16 20V18" 
                            stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                    </svg>
                    <span>Subir Archivo</span>
                    <input type="file" id="fileInput" hidden onchange="app.handleFileUpload(this)">
                </label>

                <a href="{% url 'chat_dashboard' %}" class="btn-terminal btn-back" style="
                    display: inline-flex; align-items: center; padding: 8px 16px; background-color: transparent;
                    border-radius: 4px; text-decoration: none; font-size: 13px; font-weight: bold;
                    transition: all 0.2s ease-in-out; box-sizing: border-box; cursor: pointer;
                    border: 1px solid #f4c430; color: #f4c430; font-family: 'Ubuntu Mono', monospace; white-space: nowrap;
                " onmouseover="this.style.backgroundColor='#f4c430'; this.style.color='#111111'; this.style.boxShadow='0 0 10px rgba(244,196,48,0.3)';" 
                onmouseout="this.style.backgroundColor='transparent'; this.style.color='#f4c430'; this.style.boxShadow='none';">
                    ← Volver al workspace
                </a>
            </div>
        </div>
    </header>

    <!-- BREADCRUMB -->
    <div class="breadcrumb-container" id="breadcrumb"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="content-area">
        <div class="grid" id="contentGrid">
            <div class="empty-state">
                <svg class="empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
                <p>Cargando contenido...</p>
            </div>
        </div>
    </div>

    <!-- MODAL CREAR CARPETA -->
    <div class="modal-overlay" id="folderModal">
        <div class="modal">
            <h3 style="text-align: center; margin-bottom: 1.5rem; color: #dfdbd2; font-family: 'Ubuntu Mono', monospace;">Nueva Carpeta</h3>
            <input type="text" id="folderNameInput" placeholder="Nombre de la carpeta..." 
                onkeypress="if(event.key==='Enter') app.createFolder()"
                style="width: 100%; padding: 12px 16px; background: #1e1e1e; border: 1px solid #333333; border-radius: 6px;
                color: #dfdbd2; font-family: 'Ubuntu Mono', monospace; font-size: 1rem; margin-bottom: 2rem; outline: none; transition: border-color 0.2s;"
                onfocus="this.style.borderColor='#E95420'" onblur="this.style.borderColor='#333333'">
            
            <div class="modal-actions" style="display: flex; gap: 16px; justify-content: space-between;">
                <button onclick="app.closeModal()" style="flex: 1; padding: 14px 20px; background: transparent; border: 2px solid #555555; border-radius: 6px;
                    color: #aea79f; font-family: 'Ubuntu Mono', monospace !important; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease; letter-spacing: 1px;"
                    onmouseover="this.style.background='#2a2a2a'; this.style.borderColor='#888888'; this.style.color='#ffffff';"
                    onmouseout="this.style.background='transparent'; this.style.borderColor='#555555'; this.style.color='#aea79f';">
                    Cancelar
                </button>
                <button onclick="app.createFolder()" style="flex: 1.5; padding: 14px 20px; background: #E95420; border: 2px solid #E95420; border-radius: 6px;
                    color: #ffffff; font-family: 'Ubuntu Mono', monospace !important; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(233, 84, 32, 0.3);"
                    onmouseover="this.style.background='#d94a1a'; this.style.borderColor='#d94a1a'; this.style.boxShadow='0 0 20px rgba(233,84,32,0.5)'; this.style.transform='translateY(-2px)';"
                    onmouseout="this.style.background='#E95420'; this.style.borderColor='#E95420'; this.style.boxShadow='0 4px 12px rgba(233, 84, 32, 0.3)'; this.style.transform='translateY(0)';">
                    Crear Carpeta
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL REEMPLAZAR ARCHIVO -->
    <div class="modal-overlay" id="replaceFileModal">
        <div class="modal">
            <h3 style="text-align: center; margin-bottom: 1.5rem; color: #dfdbd2; font-family: 'Ubuntu Mono', monospace;">Reemplazar Archivo</h3>
            <p style="text-align: center; color: #aea79f; font-size: 0.9rem; margin-bottom: 1.5rem; font-family: 'Ubuntu Mono', monospace;">
                Selecciona un nuevo archivo. Esto cambiará el nombre, tipo e icono.
            </p>
            
            <div style="text-align: center; margin-bottom: 2rem;">
                <label style="display: inline-block; padding: 12px 24px; background: #1e1e1e; border: 2px dashed #E95420;
                    border-radius: 6px; color: #E95420; cursor: pointer; font-family: 'Ubuntu Mono', monospace; font-weight: 600; transition: all 0.2s;"
                    onmouseover="this.style.background='#2a1a15'; this.style.borderColor='#ff6b35';"
                    onmouseout="this.style.background='#1e1e1e'; this.style.borderColor='#E95420';">
                    <span id="replaceFileName">Seleccionar archivo...</span>
                    <input type="file" id="replaceFileInput" hidden>
                </label>
            </div>
            
            <div class="modal-actions" style="display: flex; gap: 16px; justify-content: space-between;">
                <button onclick="app.closeReplaceModal()" style="flex: 1; padding: 14px 20px; background: transparent; border: 2px solid #555555; border-radius: 6px;
                    color: #aea79f; font-family: 'Ubuntu Mono', monospace !important; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease; letter-spacing: 1px;"
                    onmouseover="this.style.background='#2a2a2a'; this.style.borderColor='#888888'; this.style.color='#ffffff';"
                    onmouseout="this.style.background='transparent'; this.style.borderColor='#555555'; this.style.color='#aea79f';">
                    Cancelar
                </button>
                <button onclick="app.confirmReplaceFile()" style="flex: 1.5; padding: 14px 20px; background: #E95420; border: 2px solid #E95420; border-radius: 6px;
                    color: #ffffff; font-family: 'Ubuntu Mono', monospace !important; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease; letter-spacing: 1px; box-shadow: 0 4px 12px rgba(233, 84, 32, 0.3);"
                    onmouseover="this.style.background='#d94a1a'; this.style.borderColor='#d94a1a'; this.style.boxShadow='0 0 20px rgba(233,84,32,0.5)'; this.style.transform='translateY(-2px)';"
                    onmouseout="this.style.background='#E95420'; this.style.borderColor='#E95420'; this.style.boxShadow='0 4px 12px rgba(233, 84, 32, 0.3)'; this.style.transform='translateY(0)';">
                    Reemplazar
                </button>
            </div>
        </div>
    </div>

    <script>
        window.STORAGE_WORKSPACE_ID = "{{ workspace_id }}";
    </script>
    <script src="{% static 'js/storages/storage.js' %}"></script>
</body>
</html>
