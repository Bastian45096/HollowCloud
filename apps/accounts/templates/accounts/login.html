<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HollowCloud</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Ubuntu Mono', 'Courier New', Courier, monospace;
            background: #2c001e;
            background-image: linear-gradient(135deg, #300a24 0%, #111111 100%);
            color: #dfdbd2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #111111;
            border: 1px solid #5e2750;
            border-radius: 6px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
            position: relative;
            text-align: center;
        }

        .header {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #e95420;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #dfdbd2;
        }

        .subtitle {
            font-size: 13px;
            color: #888888;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 22px;
            text-align: center;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #aea79f;
            margin-bottom: 8px;
            text-align: center;
        }

        .form-group label::before {
            content: "$ ";
            color: #e95420;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 4px;
            color: #00ff66;
            font-family: 'Ubuntu Mono', 'Courier New', Courier, monospace;
            font-size: 15px;
            text-align: center;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #e95420;
            box-shadow: 0 0 0 2px rgba(233, 84, 32, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #e95420;
            border-radius: 4px;
            color: #e95420;
            font-family: 'Ubuntu Mono', 'Courier New', Courier, monospace;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            text-align: center;
        }

        .btn-login:hover {
            background: #e95420;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(233, 84, 32, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.5;
            border-color: #555;
            color: #555;
            cursor: not-allowed;
        }

        .footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 3px solid #e95420;
            gap: 12px;
            width: 100%;
        }

        .footer-text {
            font-size: 13px;
            color: #888888;
            text-align: center;
        }

        .btn-register {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #e95420;
            border-radius: 4px;
            color: #e95420;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Ubuntu Mono', 'Courier New', Courier, monospace;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-register:hover {
            background: #e95420;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(233, 84, 32, 0.4);
        }

        .btn-register:active {
            transform: scale(0.98);
        }

        .error-message {
            background: rgba(233, 84, 32, 0.1);
            border: 1px solid #e95420;
            color: #e95420;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        .error-message.show {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(233, 84, 32, 0.3);
            border-top-color: #e95420;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .forgot-password {
            font-size: 12px;
            color: #888888;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-top: 8px;
            transition: color 0.2s;
        }

        .forgot-password:hover {
            color: #e95420;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">Hollow<span>Cloud</span></div>
        <div class="subtitle">Iniciar sesión en tu cuenta</div>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <form id="loginForm">
        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="tu@email.com" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" id="loginBtn" class="btn-login">
            Iniciar sesión
        </button>
    </form>

    <div class="footer">
        <span class="footer-text">¿No tienes cuenta?</span>
        <a href="/register/" class="btn-register">Crear Cuenta</a>
    </div>

    
    <div id="loadingOverlay" style="
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 6px;
        display: none;
        z-index: 10;
    "></div>
</div>

<script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMessage');
    const loadingOverlay = document.getElementById('loadingOverlay'); 

    document.querySelectorAll('input').forEach(el => {
        el.addEventListener('input', function() {
            errorMsg.classList.remove('show');
        });
    });

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        errorMsg.classList.remove('show');
        
        // BLOQUEAR
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span> Iniciando sesión...';
        loadingOverlay.style.display = 'block';
        
        // DESHABILITAR INPUTS 
        document.querySelectorAll('#loginForm input').forEach(input => {
            input.disabled = true;
        });

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/APIVIEWLG/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok) {
                if (data.tokens && data.tokens.access) {
                    localStorage.setItem('access_token', data.tokens.access);
                    console.log('Access token guardado');
                } else {
                    console.warn('No se recibio access_token');
                }
                
                if (data.tokens && data.tokens.refresh) {
                    localStorage.setItem('refresh_token', data.tokens.refresh);
                    console.log('Refresh token guardado');
                } else {
                    console.warn('No se recibio refresh_token');
                }
                
                console.log('Token en localStorage:', localStorage.getItem('access_token') ? 'Existe' : 'No existe');
                window.location.href = '/accounts/dashboard/';
            } else {
                let errorText = 'Credenciales inválidas. Por favor, verifica tu email y contraseña.';
                
                if (data.message) {
                    errorText = data.message;
                } else if (data.detail) {
                    errorText = data.detail;
                } else if (data.errors) {
                    const firstError = Object.values(data.errors)[0];
                    if (Array.isArray(firstError)) {
                        errorText = firstError[0];
                    } else if (typeof firstError === 'string') {
                        errorText = firstError;
                    }
                }
                
                showError(errorText);
                //  DESBLOQUEAR EN ERROR 
                btn.disabled = false;
                btn.innerHTML = 'Iniciar sesión';
                loadingOverlay.style.display = 'none';
                document.querySelectorAll('#loginForm input').forEach(input => {
                    input.disabled = false;
                });
            }
        } catch (err) {
            showError('Error de conexión. Verifica tu conexión a internet.');
            console.error('Error:', err);
            // DESBLOQUEAR EN ERROR 
            btn.disabled = false;
            btn.innerHTML = 'Iniciar sesión';
            loadingOverlay.style.display = 'none';
            document.querySelectorAll('#loginForm input').forEach(input => {
                input.disabled = false;
            });
        }
    });

    function showError(message) {
        errorMsg.textContent = message;
        errorMsg.classList.add('show');
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const active = document.activeElement;
            if (active && (active.id === 'email' || active.id === 'password')) {
                form.dispatchEvent(new Event('submit'));
            }
        }
    });
</script>

</body>
</html>
