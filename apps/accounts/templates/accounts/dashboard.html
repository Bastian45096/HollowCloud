<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HollowCloud - Panel de Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* Paleta Industrial: Negro Consola + Rojo CentOS Stream */
        :root {
            --panel-bg-dark: #121214;
            --panel-card-bg: #1a1a1c;
            --panel-card-hover: #222225;
            --centos-red: #C91D04;
            --centos-red-hover: #E32207;
            --centos-red-glow: rgba(201, 29, 4, 0.2);
            --text-title: #ffffff;
            --text-main: #cfd1d4;
            --text-muted: #6c727a;
            --border-color: #2d2d30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Ubuntu', sans-serif;
        }

        body {
            background-color: var(--panel-bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(201, 29, 4, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(201, 29, 4, 0.03) 0%, transparent 50%);
            padding: 20px;
        }

        /* Tarjeta del dashboard */
        .dashboard-card {
            background: var(--panel-card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px 28px;
            width: 100%;
            max-width: 420px;
            backdrop-filter: blur(4px);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .dashboard-card:hover {
            border-color: var(--centos-red);
            box-shadow: 0 0 30px var(--centos-red-glow);
        }

        /* ============================================================ */
        /* 3 BOTONES: Chat, Notificaciones, Mi Perfil */
        /* ============================================================ */
        .nav-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-actions .action-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: var(--panel-card-hover);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.25s ease;
            cursor: pointer;
            position: relative;
        }

        .nav-actions .action-btn:hover {
            border-color: var(--centos-red);
            background: rgba(201, 29, 4, 0.06);
            color: #ffffff;
            box-shadow: 0 0 25px var(--centos-red-glow);
            transform: translateY(-1px);
        }

        .nav-actions .action-btn:active {
            transform: translateY(0);
        }

        .nav-actions .action-btn svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .nav-actions .action-btn:hover svg {
            color: var(--centos-red);
        }

        .nav-actions .action-btn .btn-text {
            flex: 1;
        }

        .nav-actions .action-btn .badge {
            background: var(--centos-red);
            color: #ffffff;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 12px;
            min-width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--panel-card-bg);
        }

        .nav-actions .action-btn .arrow {
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: transform 0.3s, color 0.3s;
        }

        .nav-actions .action-btn:hover .arrow {
            transform: translateX(4px);
            color: var(--centos-red);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .dashboard-card {
                padding: 24px 16px;
                margin: 0 8px;
            }

            .nav-actions .action-btn {
                font-size: 0.85rem;
                padding: 12px 14px;
            }

            .nav-actions .action-btn svg {
                width: 18px;
                height: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Tarjeta del Dashboard -->
    <div class="dashboard-card">
        <!-- 3 Botones principales -->
        <div class="nav-actions">
            <!-- 1. Chat -->
            <a href="{% url 'chat_dashboard' %}" class="action-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span class="btn-text">Chat</span>
                <span class="arrow">→</span>
            </a>

            <!-- 2. Notificaciones -->
            <a href="{% url 'notifications' %}" class="action-btn" id="notificationsBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="btn-text">Notificaciones</span>
                <span class="badge" id="notificationBadge">0</span>
                <span class="arrow">→</span>
            </a>

            <!-- 3. Mi Perfil -->
            <a href="{% url 'profile' %}" class="action-btn" id="profile-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="btn-text">Mi Perfil</span>
                <span class="arrow">→</span>
            </a>
        </div>
    </div>

    <!-- ========================================================== -->
    <!-- SCRIPT PARA CARGAR NOTIFICACIONES                          -->
    <!-- ========================================================== -->
    <script>
        // --- Cargar contador de notificaciones ---
        async function loadNotificationBadge() {
            const token = localStorage.getItem("access_token");
            if (!token) {
                return;
            }

            try {
                const response = await fetch("/api/notifications/summary/", {
                    method: "GET",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error("Error al cargar notificaciones");
                }

                const data = await response.json();
                const badge = document.getElementById("notificationBadge");
                const unreadCount = data.unread_count || 0;

                if (unreadCount > 0) {
                    badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
                    badge.style.display = 'inline-flex';
                } else {
                    badge.style.display = 'none';
                }

            } catch (err) {
                console.error("Error cargando notificaciones:", err);
            }
        }

        // --- Ejecutar al cargar la página ---
        document.addEventListener('DOMContentLoaded', function() {
            loadNotificationBadge();

            // Actualizar badge cada 30 segundos
            setInterval(loadNotificationBadge, 30000);
        });
    </script>

</body>

</html>
