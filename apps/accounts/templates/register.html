{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - HollowCloud</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Ubuntu Mono', 'Courier New', Courier, monospace;
            background: #2c001e; /* Fondo clásico berenjena de Ubuntu */
            background-image: linear-gradient(135deg, #300a24 0%, #111111 100%);
            color: #dfdbd2; /* Texto gris de consola */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #111111; /* Fondo negro de ventana de terminal */
            border: 1px solid #5e2750; /* Borde berenjena intermedio */
            border-radius: 6px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
            position: relative;
            text-align: center;
        }

        .header {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #e95420; /* Naranja oficial de Ubuntu */
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #dfdbd2;
        }

        .subtitle {
            font-size: 13px;
            color: #888888;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 22px;
            text-align: center;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #aea79f; /* Gris de etiquetas en Ubuntu */
            margin-bottom: 8px;
            text-align: center;
        }

        /* INYECCIÓN DEL CARÁCTER $ A CADA CAMPO */
        .form-group label::before {
            content: "$ ";
            color: #e95420; /* Prompt naranja */
        }

        .form-group label .required {
            color: #e95420;
            margin-left: 2px;
        }

        .form-group label .optional {
            color: #6c727a;
            font-weight: 400;
            text-transform: none;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            background: #1e1e1e; /* Gris oscuro para inputs */
            border: 1px solid #333333;
            border-radius: 4px;
            color: #00ff66; /* Texto verde consola */
            font-family: 'Ubuntu Mono', 'Courier New', Courier, monospace;
            font-size: 15px;
            text-align: center; /* Centrado de textos */
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #e95420;
            box-shadow: 0 0 0 2px rgba(233, 84, 32, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
            max-height: 120px;
            text-align: center;
        }

        /* --- AVATAR INTERACTIVO --- */
        .avatar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .file-input-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            top: 0;
            left: 0;
        }

        .avatar-preview-container {
            width: 120px;
            height: 120px;
            border-radius: 4px; /* Cambiado a cuadrado estético tipo server terminal */
            border: 2px solid #333333;
            overflow: hidden;
            background: #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s;
            cursor: pointer;
            margin: 0 auto;
        }

        .avatar-preview-container:hover {
            border-color: #e95420;
            box-shadow: 0 0 15px rgba(233, 84, 32, 0.3);
        }

        .avatar-preview-container .placeholder {
            color: #888888;
            font-size: 12px;
            text-align: center;
            padding: 10px;
            line-height: 1.4;
        }

        .avatar-preview-container .placeholder .icon {
            font-size: 24px;
            display: block;
            margin-bottom: 4px;
        }

        #avatarPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .avatar-preview-container.has-image .placeholder {
            display: none;
        }

        .avatar-preview-container.has-image #avatarPreview {
            display: block;
        }

        .file-label {
            display: inline-block;
            padding: 6px 16px;
            background: transparent;
            border: 1px solid #aea79f;
            border-radius: 4px;
            color: #aea79f;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Ubuntu Mono', 'Courier New', Courier, monospace;
        }

        .file-label:hover {
            border-color: #dfdbd2;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* --- CROPPER MÓDULO --- */
        .crop-wrapper {
            display: none;
            margin-top: 16px;
            background: #1a1a1a;
            border: 1px dashed #e95420;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            width: 100%;
        }

        .crop-container {
            max-width: 100%;
            max-height: 300px;
            margin: 0 auto 12px;
            overflow: hidden;
        }

        .crop-container img {
            max-width: 100%;
            display: block;
            margin: 0 auto;
        }

        .crop-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-crop {
            padding: 6px 18px;
            border: 1px solid;
            border-radius: 4px;
            background: transparent;
            font-family: 'Ubuntu Mono', 'Courier New', Courier, monospace;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-crop.confirm {
            color: #00ff66;
            border-color: #00ff66;
        }

        .btn-crop.confirm:hover {
            background: #00ff66;
            color: #111111;
        }

        .btn-crop.cancel {
            color: #e95420;
            border-color: #e95420;
        }

        .btn-crop.cancel:hover {
            background: #e95420;
            color: #ffffff;
        }

        .password-requirements {
            font-size: 11px;
            color: #888888;
            margin-top: 6px;
            line-height: 1.6;
            text-align: center;
        }

        .password-requirements .valid {
            color: #00ff66;
        }

        .password-requirements .invalid {
            color: #e95420;
        }

        /* --- BOTÓN PRINCIPAL UNIFICADO CON LOGIN --- */
        .btn-register {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #e95420; /* Color oficial restaurado */
            border-radius: 4px;
            color: #e95420;
            font-family: 'Ubuntu Mono', 'Courier New', Courier, monospace;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            text-align: center;
        }

        .btn-register:hover {
            background: #e95420;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(233, 84, 32, 0.4);
        }

        .btn-register:disabled {
            opacity: 0.5;
            border-color: #555;
            color: #555;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #333333;
            font-size: 13px;
            color: #888888;
        }

        .footer a {
            color: #e95420;
            text-decoration: none;
            font-weight: bold;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(233, 84, 32, 0.1);
            border: 1px solid #e95420;
            color: #e95420;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 10px 14px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        .success-message.show {
            display: block;
        }

        .field-error {
            color: #e95420;
            font-size: 12px;
            margin-top: 4px;
            display: none;
            text-align: center;
        }

        .field-error.show {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(233, 84, 32, 0.3);
            border-top-color: #e95420;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px;
            }
            .avatar-preview-container {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">Hollow<span>Cloud</span></div>
        <div class="subtitle">Crear nueva cuenta</div>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <form id="registerForm" enctype="multipart/form-data">
        <div class="form-group">
            <label for="avatar">Foto de perfil <span class="required">*</span></label>
            <div class="avatar-wrapper">
                <div class="file-input-wrapper">
                    <div class="avatar-preview-container" id="avatarContainer" onclick="document.getElementById('avatar').click()">
                        <div class="placeholder">
                            <span class="icon">📸</span>
                            Selecciona una foto
                        </div>
                        <img id="avatarPreview" alt="Vista previa del avatar">
                    </div>
                    <input type="file" id="avatar" name="avatar" accept="image/*" required>
                    <span class="file-label">Elegir imagen</span>
                </div>

                <div id="cropWrapper" class="crop-wrapper">
                    <div class="crop-container">
                        <img id="cropImage" src="" alt="Recortar imagen">
                    </div>
                    <div class="crop-actions">
                        <button type="button" onclick="confirmCrop()" class="btn-crop confirm">✓ Confirmar</button>
                        <button type="button" onclick="cancelCrop()" class="btn-crop cancel">✗ Cancelar</button>
                    </div>
                </div>
            </div>
            <div id="avatarError" class="field-error"></div>
        </div>

        <div class="form-group">
            <label for="username">Nombre de usuario <span class="required">*</span></label>
            <input type="text" id="username" name="username" placeholder="ej: juanperez" required>
            <div id="usernameError" class="field-error"></div>
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico <span class="required">*</span></label>
            <input type="email" id="email" name="email" placeholder="tu@email.com" required>
            <div id="emailError" class="field-error"></div>
        </div>

        <div class="form-group">
            <label for="first_name">Nombre <span class="optional">(opcional)</span></label>
            <input type="text" id="first_name" name="first_name" placeholder="Tu nombre">
        </div>

        <div class="form-group">
            <label for="last_name">Apellido <span class="optional">(opcional)</span></label>
            <input type="text" id="last_name" name="last_name" placeholder="Tu apellido">
        </div>

        <div class="form-group">
            <label for="password">Contraseña <span class="required">*</span></label>
            <input type="password" id="password" name="password" placeholder="••••••••" required minlength="8">
            <div class="password-requirements">
                <span id="passwordHint">Mínimo 8 caracteres, con letras, números y caracteres especiales (!@#$%^&*)</span>
            </div>
            <div id="passwordError" class="field-error"></div>
        </div>

        <div class="form-group">
            <label for="password_confirm">Confirmar contraseña <span class="required">*</span></label>
            <input type="password" id="password_confirm" name="password_confirm" placeholder="••••••••" required>
            <div id="passwordConfirmError" class="field-error"></div>
        </div>

        <div class="form-group">
            <label for="bio">Biografía <span class="optional">(opcional)</span></label>
            <textarea id="bio" name="bio" placeholder="Cuéntanos algo sobre ti..." rows="2"></textarea>
        </div>

        <button type="submit" id="registerBtn" class="btn-register">
            Crear cuenta
        </button>
    </form>

    <div class="footer">
        ¿Ya tienes cuenta? <a href="/login/">Inicia sesión</a>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="{% static 'js/logic-register.js' %}"></script>

</body>
</html>
